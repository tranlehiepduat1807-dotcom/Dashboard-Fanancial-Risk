<!doctype html><html><head><meta charset="utf-8"><title>CTCK module review</title><style>body{margin:16px;font:16px Arial;background:#e8edf4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.tile{height:480px;overflow:hidden;background:white}h2{font-size:15px;padding:8px;margin:0}iframe{width:1280px;height:900px;transform:scale(.5);transform-origin:top left;border:0}</style></head><body><h1>CTCK · Enterprise redesign</h1><div class="grid" id="grid"></div><script>for(const page of ['overview','market','settlement','concentration','stress']){const tile=document.createElement('div');tile.className='tile';tile.innerHTML='<h2>'+page+'</h2>';const f=document.createElement('iframe');f.src='index.html#/'+page;tile.append(f);grid.append(tile);}</script></body></html>
