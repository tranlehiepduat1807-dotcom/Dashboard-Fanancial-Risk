<!doctype html><html><head><meta charset="utf-8"><title>Enterprise dashboard QA</title></head><body><h1>GitHub dashboard interaction checks</h1><pre id="results">Running…</pre><iframe id="app" src="index.html" style="width:1400px;height:900px"></iframe><script>
document.querySelector('iframe').onload=async()=>{const w=document.querySelector('iframe').contentWindow,d=w.document,out=document.querySelector('#results'),passed=[];const wait=()=>new Promise(r=>setTimeout(r,80));const check=(b,s)=>{if(!b)throw Error(s);passed.push('PASS '+s);};try{await wait();check(d.querySelector('.hero-val .n').textContent==='176,19%','original FAR value retained');check(d.querySelectorAll('#nav a').length===5,'five business modules retained');for(const id of ['market','settlement','concentration','stress','overview']){w.location.hash='#/'+id;await wait();check(d.querySelector('#v-'+id).classList.contains('on')&&d.querySelector('#v-'+id).textContent.length>100,'navigation '+id);check(d.querySelector('#v-'+id+' svg')!==null,'charts render '+id);}
const from=d.querySelector('#fromInput').value;d.querySelector('[data-n="30"]').click();check(d.querySelector('#fromInput').value!==from,'date preset updates range');d.querySelector('[data-n="60"]').click();const link=d.querySelector('#v-overview .linkish');check(!!link,'capital detail link exists');link.click();check(d.querySelector('#drawer').classList.contains('on'),'detail drawer opens');d.querySelector('.dclose').click();check(!d.querySelector('#drawer').classList.contains('on'),'detail drawer closes');d.querySelector('#enterpriseMenu').click();check(d.querySelector('#enterpriseMenu').getAttribute('aria-expanded')==='true','mobile menu expands');d.querySelector('#enterpriseMenu').click();check(d.querySelector('#enterpriseMenu').getAttribute('aria-expanded')==='false','mobile menu closes');check(d.querySelector('a[aria-current="page"]')?.dataset.id==='overview','current page accessible');out.textContent=passed.join('\n')+'\nALL '+passed.length+' CHECKS PASSED';}catch(e){out.textContent=passed.join('\n')+'\nFAIL '+e.stack;}}
</script></body></html>
